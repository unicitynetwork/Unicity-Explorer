version: '3.8'

# This compose file is for running the explorer alongside Fulcrum and Alpha node
# It connects to the existing alpha-net network created by Fulcrum's docker-compose

services:
  explorer:
    image: unicity-explorer:latest
    container_name: unicity-explorer
    restart: unless-stopped
    ports:
      - "3002:3002"
    volumes:
      - explorer-data:/workspace/data
      - ./config/.env.alpha-net:/workspace/.env:ro
    environment:
      - NODE_ENV=production
    networks:
      - alpha-net
    depends_on:
      - alpha-node
      - fulcrum-alpha

volumes:
  explorer-data:
    driver: local

networks:
  alpha-net:
    external: true  # Use the existing network created by Fulcrum's docker-compose