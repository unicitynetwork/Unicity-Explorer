version: '3.8'

# Standalone deployment with host network to access local Alpha node
services:
  explorer:
    image: unicity-explorer:latest
    container_name: unicity-explorer
    network_mode: host
    restart: unless-stopped
    volumes:
      - explorer-data:/workspace/data
      - ./config/.env:/workspace/.env:ro
    environment:
      - NODE_ENV=production

volumes:
  explorer-data:
    driver: local